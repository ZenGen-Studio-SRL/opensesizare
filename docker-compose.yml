services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: opensesizare
      POSTGRES_USER: opensesizare
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me}
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  db_data:
